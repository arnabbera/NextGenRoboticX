name: Validate course sharing

on:
  push:
    branches:
      - fix/course-sharing-metadata
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check private-share-validator/worker.js
      - run: node scripts/validate-course-sharing.mjs
